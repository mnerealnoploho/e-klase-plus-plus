name: Web checks and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check and test
        run: npm run check
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: e-klase-plus-plus-web
          path: dist/server/index.js
          if-no-files-found: error
